<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form요소</title>
  </head>
  <body>
    <p>form입니ㅏㄷ</p>
    <br />
    <h2>form 요소 살펴보기</h2>
    <!--log in box-->
    <form>
      <h5>로그인해주세요</h5>
      <div>
        ID:
        <input
          type="text"
          name="userid"
          placeholder="아이디를 입력하세요"
          required
        />
      </div>
      <div>
        PW:
        <input
          type="password"
          name="password"
          placeholder="비밀번호를 입력하세요"
          required
        />
      </div>
      <input type="submit" value="들어가기" />
    </form>
  </body>
</html>
